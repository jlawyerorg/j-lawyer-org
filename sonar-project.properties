# SonarCloud analysis settings.
#
# The project's identity (organization, projectKey, projectName, ...) is supplied by the
# CI workflow (.github/workflows/pullrequests.yml -> "SonarCloud Scan" args); this file
# only carries reviewed, narrowly-scoped issue exclusions that cannot be expressed as
# inline // NOSONAR suppressions.

# --- Reviewed, accepted findings -------------------------------------------------------

sonar.issue.ignore.multicriteria=ngStyleCsp

# Web:S7039 ("unsafe-inline" in a Content-Security-Policy directive) on the Angular web
# client's index.html. The flagged directive is style-src 'unsafe-inline'. Angular injects
# component styles as runtime inline <style> elements, so 'unsafe-inline' for STYLES is
# required for the app to render (script-src stays 'self' with no unsafe-inline). Removing
# it would break all styling; the nonce-based alternative needs a per-request server-side
# CSP header, which is already noted as a future step in index.html. Scoped to this one
# file and rule only.
sonar.issue.ignore.multicriteria.ngStyleCsp.ruleKey=Web:S7039
sonar.issue.ignore.multicriteria.ngStyleCsp.resourceKey=**/j-lawyer-web/frontend/src/index.html
