# Dependabot configuration — enabled by the migrate-dependencies-to-central change.
# Now that the bulk of dependencies carry real Maven Central coordinates (instead of the
# synthetic jlawyer.thirdparty:* coordinates), Dependabot can match them against the GitHub
# advisory database and the registry, surfacing CVEs and version updates.
#
# Coverage gap (documented in openspec/changes/migrate-dependencies-to-central):
#   The residual artifacts still carried under jlawyer.thirdparty:* (proprietary / repackaged
#   / not-on-Central — e.g. the beA wrapper, javafx.*, log4j repackages, tika-app, jboss-client)
#   have no registry/advisory coordinates, so Dependabot cannot see them. They are covered, if
#   at all, by a binary CVE scanner (OWASP Dependency-Check / Trivy) as a compensating control.
version: 2
updates:
  # ---- Maven: every committed module pom in the reactor + the standalone j-lawyer-ide ----
  - package-ecosystem: "maven"
    directories:
      - "/"                                    # root: dependencyManagement / BOM (pinned versions)
      - "/j-lawyer-fax"
      - "/j-lawyer-server-common"
      - "/j-lawyer-io-common"
      - "/j-lawyer-server-entities"
      - "/j-lawyer-server-api"
      - "/j-lawyer-server"                      # EAR aggregator pom
      - "/j-lawyer-server/j-lawyer-server-ejb"
      - "/j-lawyer-server/j-lawyer-server-war"
      - "/j-lawyer-server/j-lawyer-server-io"
      - "/j-lawyer-server/j-lawyer-io"
      - "/j-lawyer-server/j-lawyer-server-ear"
      - "/j-lawyer-client"
      - "/j-lawyer-backupmgr"
      - "/j-lawyer-cloud"
      - "/j-lawyer-invoicing"
      - "/j-lawyer-ide"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Reduce PR noise: bundle all minor/patch bumps per module into one PR; majors stay separate.
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions used by the CI workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ---- npm: the Angular web UI (j-lawyer-web/frontend) ----
  # Until this block existed, npm was covered only by *security* updates, which run
  # regardless of configuration — that is why the frontend produced a burst of PRs with
  # no grouping and no ignore rules.
  #
  # The @angular*/@angular-devkit* ignores are deliberate and TEMPORARY. The frontend is
  # pinned to Angular 19, which is out of support and receives no backports, so for
  # nearly every transitive advisory (vite, tar, esbuild, webpack, rollup, piscina, the
  # sigstore chain, ...) Dependabot's only available remedy is to bump the *ancestor*
  # (@angular/cli or @angular-devkit/build-angular) to 21/22 while the rest of the
  # toolchain stays on 19. Those PRs cannot be merged: `npm ci` fails with ERESOLVE on
  # the @angular/compiler-cli peer, and TypeScript/Node requirements do not match either
  # (see the closed PRs #3530, #3531, #3538, #3540-#3545).
  #
  # Suppressing them is not risk acceptance — the alerts stay visible in the Security tab.
  # It only stops Dependabot from filing PRs it cannot make mergeable. Transitive
  # advisories that CAN be fixed in place are handled with npm `overrides` (see
  # j-lawyer-web/SUPPLY-CHAIN.md section 6), and lockfile-only PRs remain unaffected by
  # these ignores and stay mergeable as before.
  #
  # REMOVE both ignore entries as part of the Angular 19 -> 21 upgrade; they hide exactly
  # the updates that upgrade is meant to deliver.
  - package-ecosystem: "npm"
    directory: "/j-lawyer-web/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@angular/*"
      - dependency-name: "@angular-devkit/*"
