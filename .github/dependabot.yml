# Dependabot configuration — enabled by the migrate-dependencies-to-central change.
# Now that the bulk of dependencies carry real Maven Central coordinates (instead of the
# synthetic jlawyer.thirdparty:* coordinates), Dependabot can match them against the GitHub
# advisory database and the registry, surfacing CVEs and version updates.
#
# Coverage gap (documented in openspec/changes/migrate-dependencies-to-central):
#   The residual artifacts still carried under jlawyer.thirdparty:* (proprietary / repackaged
#   / not-on-Central — e.g. the beA wrapper, javafx.*, log4j repackages, tika-app, jboss-client)
#   have no registry/advisory coordinates, so Dependabot cannot see them. They are covered, if
#   at all, by a binary CVE scanner (OWASP Dependency-Check / Trivy) as a compensating control.
version: 2
updates:
  # ---- Maven: every committed module pom in the reactor + the standalone j-lawyer-ide ----
  - package-ecosystem: "maven"
    directories:
      - "/"                                    # root: dependencyManagement / BOM (pinned versions)
      - "/j-lawyer-fax"
      - "/j-lawyer-server-common"
      - "/j-lawyer-io-common"
      - "/j-lawyer-server-entities"
      - "/j-lawyer-server-api"
      - "/j-lawyer-server"                      # EAR aggregator pom
      - "/j-lawyer-server/j-lawyer-server-ejb"
      - "/j-lawyer-server/j-lawyer-server-war"
      - "/j-lawyer-server/j-lawyer-server-io"
      - "/j-lawyer-server/j-lawyer-io"
      - "/j-lawyer-server/j-lawyer-server-ear"
      - "/j-lawyer-client"
      - "/j-lawyer-backupmgr"
      - "/j-lawyer-cloud"
      - "/j-lawyer-invoicing"
      - "/j-lawyer-ide"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Reduce PR noise: bundle all minor/patch bumps per module into one PR; majors stay separate.
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions used by the CI workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # ---- npm: the Angular web UI (j-lawyer-web/frontend) ----
  # Until this block existed, npm was covered only by *security* updates, which run
  # regardless of configuration — that is why the frontend produced a burst of PRs with
  # no grouping and no ignore rules.
  #
  # The frontend is on Angular 21 (a supported line). Advisory fixes therefore arrive as
  # a *patch within the major* (e.g. 21.2.21 -> 21.2.25), which `npm ci` resolves cleanly,
  # so the former @angular*/@angular-devkit* ignores were removed with the 19 -> 21 upgrade
  # (issue #3547) — those PRs are now wanted rather than unmergeable noise. Only the peer-
  # pinned TypeScript / zone.js MAJOR bumps stay ignored (see below).
  - package-ecosystem: "npm"
    directory: "/j-lawyer-web/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript and zone.js are peer-pinned BY Angular on every version (Angular 21
      # peers typescript ">=5.9 <6.0"; @angular/core peers zone.js "~0.15.0"). A standalone
      # MAJOR bump breaks `npm ci` with ERESOLVE (see the closed PRs #3548 for zone.js
      # 0.16.2, #3549 for typescript 7.0.2), so their majors must always move *with*
      # Angular via `ng update`, never on their own. Only majors are ignored — patch/minor
      # still flows normally. rxjs is deliberately NOT ignored (peer "^6.5.3 || ^7.4.0").
      # NOTE: verify whether `update-types` ignores also suppress the *security* channel;
      # that is documented for version updates, less clearly for security updates.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
